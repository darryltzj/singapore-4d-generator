name: Deploy website

# Publishes site/ plus data/ to GitHub Pages.
# Manual only for now: on a free account Pages needs a public repo. After making the
# repo public and setting Settings > Pages > Source to "GitHub Actions", replace the
# "on:" block with the commented one to redeploy after every push and every refresh.
on:
  workflow_dispatch: {}
#  push:
#    branches: [main]
#  workflow_run:
#    workflows: ["Refresh draws"]
#    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node --test tests/stats.test.js
      - run: python -m unittest discover tests

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp site/* _site/
          cp data/sg4d_results.csv _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
